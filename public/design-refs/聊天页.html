<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>栖迟 · 聊天页</title>
<style>
  /* ── 字体（OPPO Sans 三档）── */
  @font-face { font-family:'OPPO Sans'; src:url('../font/OPPOSans-Light.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face { font-family:'OPPO Sans'; src:url('../font/OPPOSans-R.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'OPPO Sans'; src:url('../font/OPPOSans-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }

  /* ── 设计 tokens（对应 tailwind.config）── */
  :root {
    --brand:#F5A65B; --brand-deep:#E8893A; --brand-soft:#FCD9A8; --brand-pale:#FFEFC9;
    --page:#FFF8EE; --card:#FFFCF5; --subtle:#FAF1DF;
    --line:#F0E2C9;
    --ink:#5A3E2B; --ink-soft:#9C8472; --ink-mute:#C9BAA8; --ink-disabled:#DCD0BC; --ink-on:#FFF8EE;
    --shadow-xs:0 1px 2px rgba(245,166,91,.06);
    --shadow-sm:0 2px 8px rgba(245,166,91,.08);
    --ease-soft:cubic-bezier(.22,1,.36,1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#EDE3D2;
    font-family:'OPPO Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    letter-spacing:.02em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }

  /* 移动端画框 */
  .frame {
    position:relative; width:100%; max-width:420px; height:100dvh;
    margin-inline:auto; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--page);
  }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .layer { position:relative; z-index:1; display:flex; flex-direction:column; height:100%; }

  /* ── 顶部 AppBar ── */
  .appbar {
    display:flex; align-items:center; justify-content:space-between;
    height:52px; padding:0 16px; flex-shrink:0;
  }
  .appbar .left { display:flex; align-items:center; gap:8px; }
  .appbar .avatar { width:32px; height:32px; border-radius:9999px; }
  .appbar .name { font-size:17px; font-weight:500; color:var(--ink); }
  .appbar .action {
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:none; background:transparent; cursor:pointer;
  }
  .appbar .action img { width:22px; height:22px; }

  /* ── 宠物舞台（cat-idle 6 帧精灵图 呼吸动画）── */
  .stage { width:224px; height:224px; margin:8px auto 0; flex-shrink:0; }
  .pet {
    width:100%; height:100%;
    background-image:url('../pets/cat-idle.png');
    background-repeat:no-repeat;
    background-size:300% 200%;
    animation:spriteCycle 2400ms steps(1) infinite;
  }
  @keyframes spriteCycle {
    0%,15.99%{background-position:0% 0%;}   16%,32.99%{background-position:50% 0%;}
    33%,49.99%{background-position:100% 0%;} 50%,66.99%{background-position:0% 100%;}
    67%,83.99%{background-position:50% 100%;} 84%,100%{background-position:100% 100%;}
  }

  /* ── 对话气泡流 ── */
  .messages {
    flex:1; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
    padding:8px 20px 16px;
    scrollbar-width:none;
  }
  .messages::-webkit-scrollbar { display:none; }

  /* user 气泡（右） */
  .row-user { display:flex; justify-content:flex-end; }
  .bubble-user {
    max-width:75%; padding:12px 16px;
    border:1.5px solid var(--line);
    background:rgba(255,252,245,.9); backdrop-filter:blur(2px);
    border-radius:16px; border-bottom-right-radius:4px;
    font-size:15px; line-height:1.7; color:var(--ink);
    box-shadow:var(--shadow-xs);
  }

  /* pet 气泡（左）+ 翻译按钮 */
  .row-pet { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .pet-line { display:flex; align-items:flex-end; gap:8px; }
  .bubble-pet {
    padding:12px 16px;
    border-radius:16px; border-bottom-left-radius:4px;
    background:linear-gradient(135deg, rgba(252,217,168,.95), rgba(255,239,201,.95));
    backdrop-filter:blur(2px);
    font-size:15px; line-height:1.7; color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .translate-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:none; border-radius:9999px;
    background:transparent; cursor:pointer; transition:background .2s var(--ease-soft);
  }
  .translate-btn:hover { background:var(--brand-pale); }
  .translate-btn img { width:18px; height:18px; }

  /* 翻译展开气泡（缩进、Light 字重） */
  .bubble-trans {
    margin-left:4px; max-width:85%;
    padding:12px 16px; border-radius:16px;
    background:linear-gradient(135deg, rgba(255,239,201,.85), rgba(252,217,168,.75));
    backdrop-filter:blur(2px);
    font-size:16px; font-weight:300; line-height:1.8; color:var(--ink);
    box-shadow:var(--shadow-xs);
    animation:fade-in .3s var(--ease-soft) both;
  }
  @keyframes fade-in { 0%{opacity:0; transform:translateY(4px);} 100%{opacity:1; transform:translateY(0);} }

  /* ── 输入区 ── */
  .inputbar {
    display:flex; align-items:center; gap:8px;
    padding:12px 20px; flex-shrink:0;
    border-top:1px solid var(--line); background:var(--page);
  }
  .inputbar .field {
    flex:1; height:44px; padding:0 16px;
    border:1.5px solid var(--line); border-radius:9999px;
    background:var(--card);
    font-family:inherit; font-size:15px; color:var(--ink);
    outline:none; transition:border-color .2s var(--ease-soft);
  }
  .inputbar .field::placeholder { color:var(--ink-mute); }
  .inputbar .field:focus { border-color:var(--brand); }
  .send {
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; flex-shrink:0; border:none; border-radius:9999px;
    background:var(--brand); cursor:pointer; transition:background .2s var(--ease-soft), transform .2s var(--ease-soft);
  }
  .send:hover { background:var(--brand-deep); }
  .send:active { transform:scale(.95); }
  .send img { width:18px; height:18px; filter:brightness(0) invert(1); }

  /* ── 底部 TabBar ── */
  .tabbar {
    display:flex; height:64px; flex-shrink:0;
    border-top:1px solid var(--line); background:var(--page);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab {
    position:relative; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    text-decoration:none; color:var(--ink-soft);
  }
  .tab.active { color:var(--brand); }
  .tab img { width:24px; height:24px; }
  .tab span { font-size:11px; line-height:1.5; }
  .tab.active::after {
    content:''; position:absolute; bottom:4px;
    width:3px; height:3px; border-radius:9999px; background:var(--brand);
  }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <div class="frame">
    <!-- 背景：浅奶白 + 云朵 / 爪印路径 -->
    <img class="bg" src="../background/聊天页背景.png" alt="" aria-hidden="true" />

    <div class="layer">
      <!-- 顶部条 -->
      <header class="appbar">
        <div class="left">
          <img class="avatar" src="../icons/pet/cat.svg" alt="栖栖" />
          <span class="name">栖栖</span>
        </div>
        <button class="action" type="button" aria-label="设置">
          <img src="../icons/action/filter.svg" alt="" />
        </button>
      </header>

      <!-- 宠物舞台 -->
      <div class="stage"><div class="pet" role="img" aria-label="栖栖"></div></div>

      <!-- 对话气泡流 -->
      <main class="messages">
        <div class="row-user">
          <div class="bubble-user">今天面试又被反问问懵了…</div>
        </div>

        <div class="row-pet">
          <div class="pet-line">
            <div class="bubble-pet">喵～</div>
            <button class="translate-btn" type="button" aria-label="翻译">
              <img src="../icons/action/translate.svg" alt="" />
            </button>
          </div>
          <div class="bubble-trans">嗯…那一瞬间是会发懵的。来我这儿坐会儿。</div>
        </div>
      </main>

      <!-- 输入区 -->
      <footer class="inputbar">
        <input class="field" type="text" placeholder="跟栖栖说说…" />
        <button class="send" type="button" aria-label="发送">
          <img src="../icons/action/send.svg" alt="" />
        </button>
      </footer>

      <!-- 底部导航 -->
      <nav class="tabbar">
        <a class="tab active" href="#">
          <img src="../icons/tab/chat-active.svg" alt="" /><span>聊天</span>
        </a>
        <a class="tab" href="#">
          <img src="../icons/tab/notebook.svg" alt="" /><span>小本本</span>
        </a>
        <a class="tab" href="#">
          <img src="../icons/tab/chart.svg" alt="" /><span>曲线</span>
        </a>
        <a class="tab" href="#">
          <img src="../icons/tab/me.svg" alt="" /><span>我</span>
        </a>
      </nav>
    </div>
  </div>
</body>
</html>
